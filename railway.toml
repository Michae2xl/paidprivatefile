# Railway deploy config for the standalone Paid Private File site.
# Pure Next.js app (no Rust), built with Nixpacks.
[build]
builder = "NIXPACKS"

[deploy]
# `next start --hostname 0.0.0.0` honors Railway's $PORT.
startCommand = "npm run start"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
